name: PR Quality Gate

on:
  pull_request:
    branches: [feature/structure-projet]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backEnd/package-lock.json
      - run: npm ci
        working-directory: backEnd
      - run: npm run lint
        working-directory: backEnd
      - run: npm run format:check
        working-directory: backEnd

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontEnd/package-lock.json
      - run: npm ci
        working-directory: frontEnd
      - run: npm run lint
        working-directory: frontEnd
      - run: npm run format:check
        working-directory: frontEnd

  typecheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backEnd/package-lock.json
      - run: npm ci
        working-directory: backEnd
      - run: npx tsc --noEmit
        working-directory: backEnd

  typecheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontEnd/package-lock.json
      - run: npm ci
        working-directory: frontEnd
      - run: npx tsc --noEmit
        working-directory: frontEnd
